<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="katsudon08 - Frontend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="1" stop-color="#1a1b27"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#f7768e"/>
      <animate attributeName="x1" values="0;0.25;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.25;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="260" rx="20" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#7aa2f7" stroke-width="1" opacity="0.06">
    <path d="M0 65 H1200 M0 130 H1200 M0 195 H1200"/>
    <path d="M150 0 V260 M300 0 V260 M450 0 V260 M600 0 V260 M750 0 V260 M900 0 V260 M1050 0 V260"/>
  </g>

  <!-- neon corner accents -->
  <path d="M28 20 H70 M28 20 V56" stroke="#7dcfff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M1172 240 H1130 M1172 240 V204" stroke="#f7768e" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- title -->
  <text x="600" y="118" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="800" letter-spacing="2" fill="url(#neon)" filter="url(#glow)">katsudon08</text>

  <!-- animated underline -->
  <rect x="440" y="140" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="width" values="0;320;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;440;600" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="600" y="188" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="500" letter-spacing="4" fill="#a9b1d6">FRONTEND DEVELOPER · STUDENT AT NITIC</text>
</svg>
